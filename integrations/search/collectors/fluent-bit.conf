# Fluent Bit reads the wlog JSON lines and forwards them unchanged.
[SERVICE]
    flush        1
    parsers_file parsers.conf

[INPUT]
    name        tail
    path        /var/log/wlog/*.ndjson
    parser      json
    tag         wlog

[OUTPUT]
    name        http
    match       wlog
    host        logs.example.com
    port        443
    uri         /ingest
    format      json
    tls         on
