# Integration stack for the optional drain tests (make integration).
# Not used by make test or make race.
services:
  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    command: ["--config=env:OTEL_CONFIG"]
    environment:
      # The collector reads its config from this env var, so the stack stays in one file.
      OTEL_CONFIG: |
        receivers:
          otlp:
            protocols:
              http:
                # Every interface, because the collector runs in its own container and
                # binds only localhost by default.
                endpoint: 0.0.0.0:4318
        exporters:
          file:
            path: /out/logs.json
        service:
          pipelines:
            logs:
              receivers: [otlp]
              exporters: [file]
    ports:
      - "4318:4318"
    volumes:
      - ./.integration-out:/out

  clickhouse:
    # 25.3 is the first release where the JSON column type is production-ready, which is
    # what clickhouse.DDLJSON relies on.
    image: clickhouse/clickhouse-server:25.3
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30
