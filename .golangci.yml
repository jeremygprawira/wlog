# golangci-lint v2 configuration for wlog.
#
# The default set (errcheck, govet, ineffassign, staticcheck, unused) is the floor.
# The extra linters cover error wrapping, leaked response bodies, and the small
# mistakes that a review would otherwise catch by hand. The doc-comment linters
# stay off, because this repository checks those with tools ste.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - unconvert
    - usestdlibvars
    - whitespace
  exclusions:
    generated: lax
    paths:
      # Fixtures on purpose: they hold the mistakes the tools must find.
      - testdata
    rules:
      # The conformance suite runs on a module whose floor is Go 1.21, and
      # httptest.NewRequestWithContext arrives in Go 1.23.
      - path: internal/conformance/suite\.go
        linters:
          - noctx
      # A test may ignore an error on a call that cannot fail.
      - path: _test\.go
        linters:
          - errcheck
          - noctx
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
